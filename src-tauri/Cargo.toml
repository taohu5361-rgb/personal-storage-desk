[package]
name = "script-collection"
version = "0.1.0"
description = "个人收纳台 Windows 桌面原型"
authors = ["Plume"]
license = "MIT"
rust-version = "1.88"
edition = "2021"

[lib]
name = "script_collection_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["protocol-asset", "devtools", "tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rfd = "=0.15.4"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
